name: pages
# Syncs site/ to the gh-pages branch, which GitHub Pages serves at https://meefs.github.io/InverseCramer/
on:
  workflow_dispatch:
  push:
    branches: [claude/wizardly-ritchie-9at5r9]
    paths: [site/**, .github/workflows/pages.yml]
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit site/ to gh-pages
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin gh-pages
          wt="$RUNNER_TEMP/gh-pages"
          git worktree add -q -B gh-pages "$wt" origin/gh-pages
          rsync -a --delete --exclude .git site/ "$wt/"
          git -C "$wt" add -A
          git -C "$wt" commit -qm "site from ${GITHUB_SHA::7}" || { echo "site unchanged"; exit 0; }
          git -C "$wt" push -q origin gh-pages
          echo "Published https://meefs.github.io/InverseCramer/"
