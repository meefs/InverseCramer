name: publish-renders
description: Commit finished files to the `renders` branch under gh/<name>/ so they can be fetched with git
inputs:
  name: { required: true, description: "subfolder under gh/" }
  files: { required: true, description: "space-separated paths to copy" }
runs:
  using: composite
  steps:
    - name: Commit to renders branch
      shell: bash
      run: |
        set -euo pipefail
        tmp=$(mktemp -d)
        cp ${{ inputs.files }} "$tmp"/
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # work in a separate worktree so the job's own checkout (and its local actions) stays intact
        wt="$RUNNER_TEMP/renders"
        for attempt in 1 2 3 4; do
          rm -rf "$wt"; git worktree prune
          if git fetch -q origin renders 2>/dev/null; then
            git worktree add -q -B renders "$wt" origin/renders
          else
            git worktree add -q --detach "$wt" && git -C "$wt" checkout -q --orphan renders && git -C "$wt" rm -rqf --cached . && git -C "$wt" clean -fdq
          fi
          mkdir -p "$wt/gh/${{ inputs.name }}"
          cp "$tmp"/* "$wt/gh/${{ inputs.name }}/"
          echo "run ${{ github.run_id }} from ${{ github.sha }} at $(date -u +%FT%TZ)" > "$wt/gh/${{ inputs.name }}/PROVENANCE.txt"
          git -C "$wt" add "gh/${{ inputs.name }}"
          git -C "$wt" commit -qm "renders: ${{ inputs.name }} (run ${{ github.run_id }})" || { echo "nothing to commit"; exit 0; }
          git -C "$wt" push -q origin renders && exit 0
          sleep $((attempt * 5))
        done
        exit 1
